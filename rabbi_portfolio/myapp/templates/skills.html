{% extends 'base.html' %}

{% block content %}
<section class="section-gap">
    <div class="container">
        <div class="section-head">
            <h1>Technical Skills</h1>
        </div>

        <div class="grid grid-2">
            {% for group in skill_groups %}
            <article class="card">
                <h2>{{ group.title }}</h2>
                <ul>
                    {% for item in group.items %}
                    <li>{{ item }}</li>
                    {% endfor %}
                </ul>
            </article>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
