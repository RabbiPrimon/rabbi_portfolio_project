{% extends 'base.html' %}

{% block content %}
<section class="section-gap">
    <div class="container narrow">
        <div class="section-head">
            <h1>Blog</h1>
        </div>

        {% for post in posts %}
        <article class="card">
            <h2>{{ post.title }}</h2>
            <p class="muted">Published on {{ post.created_at|date:"M d, Y" }}</p>
            <p>{{ post.content|truncatewords:40 }}</p>
        </article>
        {% empty %}
        <article class="card">
            <p>No blog posts available.</p>
        </article>
        {% endfor %}
    </div>
</section>
{% endblock %}
