{% extends 'base.html' %}

{% block content %}
<section class="section-gap">
    <div class="container narrow">
        <div class="section-head">
            <h1>Contact</h1>
        </div>

        <article class="card">
            <p><strong>Email:</strong> <a href="mailto:{{ profile.email }}">{{ profile.email }}</a></p>
            <p><strong>Phone:</strong> {{ profile.phone }}</p>
            <p><strong>Location:</strong> {{ profile.location }}</p>
            <p><strong>GitHub:</strong> <a href="{{ profile.github }}" target="_blank" rel="noopener">{{ profile.github }}</a></p>
            <p><strong>LinkedIn:</strong> <a href="{{ profile.linkedin }}" target="_blank" rel="noopener">{{ profile.linkedin }}</a></p>
        </article>

        <form class="card form" method="post">
            {% csrf_token %}
            <label for="name">Name</label>
            <input id="name" type="text" name="name" required>

            <label for="email">Email</label>
            <input id="email" type="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button class="btn" type="submit">Send Message</button>
        </form>
    </div>
</section>
{% endblock %}
